# Forge 加载器与许可；附加条款随 JAR 保存在 META-INF 中。
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}; see META-INF/ADDITIONAL-LICENCE.txt"
issueTrackerURL="https://github.com/KKBK-233/JarsAuth-DeviceApproval/issues"

# 对外显示独立维护版，继续保留原始代码作者署名。
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/KKBK-233/JarsAuth-DeviceApproval"
authors="${mod_authors}"
credits="Based on Jissee/JarsAuth; independently maintained by KKBK-233."
displayTest="MATCH_VERSION"
description='''${mod_description}'''

# 客户端和服务端都使用 Minecraft 1.20.1 与 Forge 47 系列。
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
